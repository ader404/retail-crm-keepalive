name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes (UTC)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    concurrency:
      group: keep-render-alive
      cancel-in-progress: false

    steps:
      - name: Ping Backend Service
        run: |
          echo "⏰ Pinging backend at $(date -u)"
          # Fails the step if non-2xx, times out after 10s
          if curl -sS --fail --max-time 10 -o /dev/null -w "%{http_code}" \
               https://retail-crm-backend.onrender.com/health; then
            echo "Backend OK"
          else
            echo "Backend DOWN" >&2
            exit 1
          fi

      - name: Ping Frontend Service
        run: |
          echo "⏰ Pinging frontend at $(date -u)"
          # follow redirects (-L) in case root redirects, fail on non-2xx
          if curl -sS --fail --max-time 10 -o /dev/null -w "%{http_code}" -L \
               https://retail-crm-frontend.onrender.com/; then
            echo "Frontend OK"
          else
            echo "Frontend DOWN" >&2
            exit 1
          fi

      - name: Keep-alive result
        run: echo "✅ Keep-alive ping completed at $(date -u)"
